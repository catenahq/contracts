name: pr
on:
  workflow_call:
    secrets:
      CATENA_EE_READ_TOKEN:
        required: false
permissions: {}
jobs:
  plan:
    runs-on: catena-ci
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/demo
  check:
    name: check (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: catena-ci
    permissions:
      contents: read
    strategy:
      matrix:
        name: [one]
    steps:
      - run: echo check
  gate:
    needs: [plan, check]
    if: ${{ !cancelled() }}
    runs-on: catena-ci
    permissions:
      contents: read
      statuses: write
    steps:
      - env:
          TOKEN: ${{ secrets.CATENA_EE_READ_TOKEN }}
        run: test -n "$TOKEN"
