name: ci-control
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review, auto_merge_enabled]
  workflow_run:
    workflows: [ci]
    types: [completed]
  push:
    branches: [main, release]
  schedule:
    - cron: '7 * * * *'
permissions: {}
jobs:
  control:
    uses: catenahq/contracts/.github/workflows/control.yml@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa # main
    permissions:
      contents: read
      statuses: write
    with:
      runner: catena-ci
