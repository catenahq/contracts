name: new-failures-only
description: >-
  Run a gate command. With a base commit (the base input, or on a pull request
  the merge commit's first parent) it fails only on failures that commit does
  not have; otherwise it keeps the absolute gate.

inputs:
  run:
    description: The gate command, run with bash -eo pipefail.
    required: true
  working-directory:
    description: Where the command runs.
    default: '.'
  repo-path:
    description: The checkout that moves to the base commit for the comparison run.
    required: true
  failure-lines:
    description: >-
      Extended regex. Each matched part of an output line is one failure's
      identity. Empty: the exit status alone (a failing base passes the pull
      request).
    default: ''
  base:
    description: >-
      The commit the change is judged from. Empty: on a pull request, the first
      parent of the merge commit checked out at repo-path, else the event's base
      commit; any other event keeps the absolute gate.
    default: ''
  token:
    description: Token that fetches the base commit.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - shell: bash
      env:
        NFO_RUN: ${{ inputs.run }}
        NFO_WORKDIR: ${{ inputs.working-directory }}
        NFO_REPO_PATH: ${{ inputs.repo-path }}
        NFO_FAILURE_LINES: ${{ inputs.failure-lines }}
        NFO_TOKEN: ${{ inputs.token }}
        NFO_BASE_SHA: ${{ inputs.base }}
        NFO_EVENT_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
      run: bash "$GITHUB_ACTION_PATH/new-failures-only.sh"
