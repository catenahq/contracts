version: 2

# Wave 1 dependency automation. contracts/ is the producer of the
# vendored tarball consumed by docs/website/portal; deliberate
# version bumps are tagged manually, but Dependabot still surfaces
# upstream CVEs in the few dev/test dependencies under package.json.

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      npm-deps:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
