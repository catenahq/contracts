name: security

# Bundled FOSS security scan via catenahq/scanctl (profile full), through its
# reusable workflow. Every finding gates on every run; this repo pins no image.

on:
  pull_request:
  # Every pushed branch. Renovate and engine-bump branches always carry a pull
  # request, which tests each push to them.
  push:
    branches-ignore: ['renovate/**', 'engine-bump/**', 'scanctl/**']
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read
  security-events: write

# A newer push to the branch, or a newer commit of the pull request, cancels the
# run it supersedes; the weekly run is in a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scanctl:
    uses: catenahq/scanctl/.github/workflows/github-reusable.yml@main
    # The called job asks for all three; a caller granting fewer fails to start.
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    with:
      profile: full
      runner: ubuntu-latest
