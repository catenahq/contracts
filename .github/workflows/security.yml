name: security

# Bundled FOSS security scan via catenahq/scanctl (profile full), through its
# reusable workflow. Every finding gates on every run; this repo pins no image.

on:
  pull_request:
  # A change is scanned once, on its pull request, Renovate's included. A push
  # runs the scan only on the default branch.
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read
  security-events: write

# A newer push to the branch, or a newer commit of the pull request, cancels the
# run it supersedes; the weekly run is in a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scanctl:
    uses: catenahq/scanctl/.github/workflows/github-reusable.yml@main
    # The called jobs ask for all four; a caller granting fewer fails to start.
    permissions:
      actions: read
      contents: read
      security-events: write
      pull-requests: write
    with:
      profile: full
      runner: ubuntu-26.04
