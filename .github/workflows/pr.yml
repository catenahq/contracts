name: pr

# The shared pull request workflow of the catenahq repositories. A caller's
# ci.yml holds the triggers and calls this file with its runner label; its
# .github/checks.yml names the checks (README.md, "Shared PR workflow").
#
# plan reads checks.yml as data into a matrix and the scan settings, and
# reuses an earlier success of the same tree; check runs each entry with bash
# ci/run <name>, or the contracts gates for the entry named gates; scan runs
# scanctl on a push or pull request and scan-daily on a scheduled run; gate is
# the one status a branch rule requires. The CI code comes from this
# repository at the commit the caller pins (job.workflow_sha), checked out
# under .catena-ci: a "./" action resolves against the caller's workspace. The
# gate scripts and every other sibling come from the caller's
# .github/catenahq.lock; scanctl comes from this repository's lock.

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label of plan, gate and every check that names no runs-on.
        type: string
        required: true

permissions: {}

jobs:
  plan:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      actions: read # same-tree reads the runs and artifacts of the caller
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      run: ${{ steps.tree.outputs.run }}
      # scan is the JSON the scan action reads; scan-run is whether a scan job
      # runs: checks.yml has a scan key and the tree is not reused.
      scan: ${{ steps.matrix.outputs.scan }}
      scan-run: ${{ steps.matrix.outputs.scan-enabled == 'true' && steps.tree.outputs.run == 'true' }}
    steps:
      - name: Check out the caller
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          path: ws/${{ github.event.repository.name }}
          persist-credentials: false
      - name: Check out the CI code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .catena-ci
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"
      - name: Install the matrix parser
        run: npm ci --prefix .catena-ci/scripts/ci --ignore-scripts --no-audit --no-fund
      - name: Matrix
        id: matrix
        working-directory: ws/${{ github.event.repository.name }}
        env:
          RUNNER_LABEL: ${{ inputs.runner }}
        # The siblings of every entry and of the scan join the same-tree key.
        run: |
          plan="$(node "$GITHUB_WORKSPACE/.catena-ci/scripts/ci/checks-matrix.mjs" --runner "$RUNNER_LABEL")"
          echo "$plan" | jq .
          siblings="$(jq -r '[(.include[].sib, .scan.sib) | to_entries[] | select(.value != "") | "catenahq/" + .key] | unique | join(" ")' <<< "$plan")"
          echo "matrix=$(jq -c '{include}' <<< "$plan")" >> "$GITHUB_OUTPUT"
          echo "scan=$(jq -c .scan <<< "$plan")" >> "$GITHUB_OUTPUT"
          echo "scan-enabled=$(jq -r .scan.enabled <<< "$plan")" >> "$GITHUB_OUTPUT"
          echo "siblings=$siblings" >> "$GITHUB_OUTPUT"
      - name: Same tree
        id: tree
        uses: ./.catena-ci/.github/actions/same-tree
        with:
          siblings: ${{ steps.matrix.outputs.siblings }}
          lock: ws/${{ github.event.repository.name }}/.github/catenahq.lock
          wait-minutes: '0'

  check:
    name: check (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        working-directory: ws/${{ github.event.repository.name }}
    steps:
      - name: Check out the caller
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          path: ws/${{ github.event.repository.name }}
          persist-credentials: false
      - name: Check out the CI code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .catena-ci
          persist-credentials: false
      # One step per sibling the matrix parser knows (SIBLINGS in
      # scripts/ci/checks-matrix.mjs), each at the caller's lock.
      - name: Check out sibling catena-admin
        if: matrix.sib.catena-admin != ''
        uses: ./.catena-ci/.github/actions/checkout-sibling
        with:
          repository: catenahq/catena-admin
          path: ws/catena-admin
          lock: ws/${{ github.event.repository.name }}/.github/catenahq.lock
          fetch-depth: ${{ matrix.sib.catena-admin }}
      - name: Check out sibling catena-ce
        if: matrix.sib.catena-ce != ''
        uses: ./.catena-ci/.github/actions/checkout-sibling
        with:
          repository: catenahq/catena-ce
          path: ws/catena-ce
          lock: ws/${{ github.event.repository.name }}/.github/catenahq.lock
          fetch-depth: ${{ matrix.sib.catena-ce }}
      - name: Check out sibling catena-templates
        if: matrix.sib.catena-templates != ''
        uses: ./.catena-ci/.github/actions/checkout-sibling
        with:
          repository: catenahq/catena-templates
          path: ws/catena-templates
          lock: ws/${{ github.event.repository.name }}/.github/catenahq.lock
          fetch-depth: ${{ matrix.sib.catena-templates }}
      - name: Check out sibling contracts
        if: matrix.sib.contracts != ''
        uses: ./.catena-ci/.github/actions/checkout-sibling
        with:
          repository: catenahq/contracts
          path: ws/contracts
          lock: ws/${{ github.event.repository.name }}/.github/catenahq.lock
          fetch-depth: ${{ matrix.sib.contracts }}
      - name: Check out sibling docs
        if: matrix.sib.docs != ''
        uses: ./.catena-ci/.github/actions/checkout-sibling
        with:
          repository: catenahq/docs
          path: ws/docs
          lock: ws/${{ github.event.repository.name }}/.github/catenahq.lock
          fetch-depth: ${{ matrix.sib.docs }}
      - name: Check out sibling ops
        if: matrix.sib.ops != ''
        uses: ./.catena-ci/.github/actions/checkout-sibling
        with:
          repository: catenahq/ops
          path: ws/ops
          lock: ws/${{ github.event.repository.name }}/.github/catenahq.lock
          fetch-depth: ${{ matrix.sib.ops }}
      - if: matrix.tools.node != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.tools.node }}
      - if: matrix.tools.uv != ''
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ matrix.tools.uv }}
          enable-cache: false
      - if: matrix.tools.go != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.tools.go != 'go.mod' && matrix.tools.go || '' }}
          go-version-file: ${{ matrix.tools.go == 'go.mod' && format('ws/{0}/go.mod', github.event.repository.name) || '' }}
          cache: false
      - name: Install staticcheck
        if: matrix.tools.staticcheck != ''
        working-directory: ${{ runner.temp }}
        env:
          VERSION: ${{ matrix.tools.staticcheck }}
          SHA256: ${{ matrix.tools.staticcheck-sha256 }}
        run: |
          curl -fsSLo staticcheck.tar.gz "https://github.com/dominikh/go-tools/releases/download/${VERSION}/staticcheck_linux_amd64.tar.gz"
          echo "$SHA256  staticcheck.tar.gz" | sha256sum -c -
          tar -xzf staticcheck.tar.gz
          echo "$RUNNER_TEMP/staticcheck" >> "$GITHUB_PATH"
      # Pinned in contracts/.vale-version, which check-prose.mjs also reads and
      # enforces: the grammars decide which comments are visible.
      - name: Install vale
        if: matrix.name == 'gates'
        working-directory: ${{ github.workspace }}
        run: |
          version="$(cat ws/contracts/.vale-version)"
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/errata-ai/vale/releases/download/v${version}/vale_${version}_Linux_64-bit.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" vale
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Contracts gates
        # Every gate runs and prints its findings; any failure fails the step.
        if: matrix.name == 'gates'
        env:
          APP_NAMES: ${{ toJSON(matrix.gates.core-app-names) }}
          DUPLICATION: ${{ matrix.gates.duplication }}
        run: |
          status=0
          node ../contracts/scripts/check-unicode.mjs || status=1
          node ../contracts/scripts/check-repo-rules.mjs || status=1
          node ../contracts/scripts/check-prose.mjs || status=1
          mapfile -t args < <(jq -r '.[]' <<< "$APP_NAMES")
          if [ "${#args[@]}" -gt 0 ]; then
            node ../contracts/scripts/check-core-app-names.mjs "${args[@]}" || status=1
          fi
          if [ "$DUPLICATION" = true ]; then
            npx --yes jscpd@4.3.0 --silent || status=1
          fi
          exit "$status"
      - name: bash ci/run ${{ matrix.name }}
        if: matrix.name != 'gates'
        env:
          CHECK: ${{ matrix.name }}
        run: bash ci/run "$CHECK"

  scan:
    # scanctl over the caller's tree and own images (.github/actions/scan).
    needs: plan
    if: needs.plan.outputs.scan-run == 'true' && github.event_name != 'schedule'
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      security-events: write # code-scanning upload (public repositories)
      pull-requests: write # the sticky findings comment
    steps:
      - name: Check out the CI code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .catena-ci
          persist-credentials: false
      - uses: ./.catena-ci/.github/actions/scan
        with:
          scan: ${{ needs.plan.outputs.scan }}

  scan-daily:
    # The scan of a scheduled run: image pulls log in to Docker Hub with the
    # caller's environment ci when it holds DOCKERHUB_USERNAME and
    # DOCKERHUB_TOKEN, and a failure opens the issue labelled scan, or comments
    # on the open one.
    needs: plan
    if: needs.plan.outputs.scan-run == 'true' && github.event_name == 'schedule'
    runs-on: ${{ inputs.runner }}
    environment:
      name: ci
      deployment: false
    permissions:
      contents: read
      security-events: write # code-scanning upload (public repositories)
      pull-requests: write # the sticky findings comment
      issues: write # the scan issue
    steps:
      - name: Check out the CI code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .catena-ci
          persist-credentials: false
      - name: Docker Hub login
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "environment ci holds no Docker Hub login: images are pulled anonymously"
            exit 0
          fi
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - uses: ./.catena-ci/.github/actions/scan
        with:
          scan: ${{ needs.plan.outputs.scan }}
      - name: Open or update the scan issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          number="$(gh issue list --repo "$REPO" --label scan --state open --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body "The scheduled scan failed again: $RUN_URL"
            exit 0
          fi
          if ! gh api "repos/$REPO/labels/scan" --silent; then
            gh label create scan --repo "$REPO" --description "The scheduled scan failed"
          fi
          gh issue create --repo "$REPO" --label scan --title "The scheduled scan failed" \
            --body "The scheduled scan failed: $RUN_URL. The run's summary lists the findings; later failures comment here."

  gate:
    # The required status: a draft, a plan that did not succeed, or a check or
    # scan that ended other than success or skipped fails it. A reused result
    # skips every check and scan and passes. On a pull request it then posts
    # the commit status of the same name, pending while a Depends-on pull
    # request is open.
    needs: [plan, check, scan, scan-daily]
    if: ${{ !cancelled() }}
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      statuses: write # the commit status ci / gate
      pull-requests: read # the pull request body and the pull requests it depends on
    steps:
      - name: Gate
        env:
          DRAFT: ${{ github.event.pull_request.draft }}
          PLAN: ${{ needs.plan.result }}
          CHECK: ${{ needs.check.result }}
          SCAN: ${{ needs.scan.result }}
          SCAN_DAILY: ${{ needs.scan-daily.result }}
        run: |
          if [ "$DRAFT" = true ]; then
            echo "::error::a draft pull request does not pass the gate; mark it ready for review"
            exit 1
          fi
          if [ "$PLAN" != success ]; then
            echo "::error::plan: $PLAN"
            exit 1
          fi
          status=0
          for job in "checks: $CHECK" "scan: $SCAN" "scan-daily: $SCAN_DAILY"; do
            case "${job#*: }" in
              success | skipped) echo "$job" ;;
              *)
                echo "::error::$job"
                status=1
                ;;
            esac
          done
          exit "$status"
      # Reached only when the result above passed: a failed result never
      # posts success.
      - name: Check out the CI code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .catena-ci
          persist-credentials: false
      - if: github.event_name == 'pull_request'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26.13.1"
      - name: Post the commit status ci / gate
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: node .catena-ci/scripts/ci/gate-status.mjs --repo "$REPO" --pr "$PR" --sha "$SHA"
