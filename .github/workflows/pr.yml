name: pr

# The shared pull request workflow of the catenahq repositories. A caller's
# ci.yml holds the triggers and calls this file with its runner label; its
# .github/checks.yml names the checks (README.md, "Shared PR workflow").
#
# plan reads checks.yml as data into a matrix and the scan settings, and
# reuses an earlier success of the same tree; check runs each entry with bash
# ci/run <name>, or the contracts gates for the entry named gates; scan runs
# scanctl on a push or pull request and scan-daily on a scheduled run; gate is
# the one status a branch rule requires. The CI code comes from this
# repository at the commit the caller pins (job.workflow_sha), checked out
# under .catena-ci: a "./" action resolves against the caller's workspace. The
# gate scripts and every other sibling come from the caller's
# .github/catenahq.lock; scanctl comes from this repository's lock. A sibling
# a check reads with a token is fetched by plan, the one job that holds the
# token and runs none of the caller's code, and reaches check as a git bundle.

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label of plan, gate and every check that names no runs-on.
        type: string
        required: true
    secrets:
      CATENA_EE_READ_TOKEN:
        description: Reads the private siblings a check names with token CATENA_EE_READ_TOKEN.
        required: false

permissions: {}

jobs:
  plan:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      actions: read # same-tree reads the runs and artifacts of the caller
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      run: ${{ steps.tree.outputs.run }}
      # scan is the JSON the scan action reads; scan-run is whether a scan job
      # runs: checks.yml has a scan key and the tree is not reused.
      scan: ${{ steps.matrix.outputs.scan }}
      scan-run: ${{ steps.matrix.outputs.scan-enabled == 'true' && steps.tree.outputs.run == 'true' }}
      # The commit of each bundled sibling, {"<repo>":"<sha>"}.
      bundle-shas: ${{ steps.bundle.outputs.bundle-shas }}
    steps:
      - name: Check out the caller
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          path: ws/${{ github.event.repository.name }}
          persist-credentials: false
      - name: Check out the CI code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .catena-ci
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"
      - name: Install the matrix parser
        run: npm ci --prefix .catena-ci/scripts/ci --ignore-scripts --no-audit --no-fund
      - name: Matrix
        id: matrix
        working-directory: ws/${{ github.event.repository.name }}
        env:
          RUNNER_LABEL: ${{ inputs.runner }}
          REPO: ${{ github.event.repository.name }}
          PRIVATE: ${{ github.event.repository.private }}
          HAS_TOKEN: ${{ secrets.CATENA_EE_READ_TOKEN != '' }}
        # The siblings of every entry and of the scan join the same-tree key.
        # A bundle travels as an artifact, which anyone who can read a public
        # repository can download, so only a private caller bundles.
        run: |
          plan="$(node "$GITHUB_WORKSPACE/.catena-ci/scripts/ci/checks-matrix.mjs" --repo "$REPO" --runner "$RUNNER_LABEL")"
          echo "$plan" | jq .
          siblings="$(jq -r '[(.include[].sib, .scan.sib) | to_entries[] | select(.value != "") | "catenahq/" + .key] | unique | join(" ")' <<< "$plan")"
          bundles="$(jq -c '[.include[].sib | to_entries[] | select(.value == "bundle") | .key] | unique' <<< "$plan")"
          if [ "$bundles" != '[]' ] && [ "$PRIVATE" != true ]; then
            echo "::error::a check reads a sibling with a token, and its bundle would be an artifact of this public repository"
            exit 1
          fi
          if [ "$bundles" != '[]' ] && [ "$HAS_TOKEN" != true ]; then
            echo "::error::a check reads a sibling with CATENA_EE_READ_TOKEN: pass it under secrets in the job that calls pr.yml"
            exit 1
          fi
          echo "matrix=$(jq -c '{include}' <<< "$plan")" >> "$GITHUB_OUTPUT"
          echo "scan=$(jq -c .scan <<< "$plan")" >> "$GITHUB_OUTPUT"
          echo "scan-enabled=$(jq -r .scan.enabled <<< "$plan")" >> "$GITHUB_OUTPUT"
          echo "siblings=$siblings" >> "$GITHUB_OUTPUT"
          echo "bundles=$bundles" >> "$GITHUB_OUTPUT"
      - name: Same tree
        id: tree
        uses: ./.catena-ci/.github/actions/same-tree
        with:
          siblings: ${{ steps.matrix.outputs.siblings }}
          lock: ws/${{ github.event.repository.name }}/.github/catenahq.lock
          wait-minutes: '0'
          sibling-token: ${{ secrets.CATENA_EE_READ_TOKEN || github.token }}
      # A sibling a check reads as a bundle: fetched with the token at the
      # caller's lock, bundled at the commit checked out, and uploaded for
      # check. One step per sibling the matrix parser knows (SIBLINGS in
      # scripts/ci/checks-matrix.mjs).
      - name: Fetch sibling catena-admin
        if: steps.tree.outputs.run == 'true' && contains(fromJSON(steps.matrix.outputs.bundles), 'catena-admin')
        uses: ./.catena-ci/.github/actions/checkout-sibling
        with:
          repository: catenahq/catena-admin
          path: siblings/catena-admin
          lock: ws/${{ github.event.repository.name }}/.github/catenahq.lock
          token: ${{ secrets.CATENA_EE_READ_TOKEN }}
          fetch-depth: '0'
      - name: Fetch sibling catena-ce
        if: steps.tree.outputs.run == 'true' && contains(fromJSON(steps.matrix.outputs.bundles), 'catena-ce')
        uses: ./.catena-ci/.github/actions/checkout-sibling
        with:
          repository: catenahq/catena-ce
          path: siblings/catena-ce
          lock: ws/${{ github.event.repository.name }}/.github/catenahq.lock
          token: ${{ secrets.CATENA_EE_READ_TOKEN }}
          fetch-depth: '0'
      - name: Fetch sibling catena-templates
        if: steps.tree.outputs.run == 'true' && contains(fromJSON(steps.matrix.outputs.bundles), 'catena-templates')
        uses: ./.catena-ci/.github/actions/checkout-sibling
        with:
          repository: catenahq/catena-templates
          path: siblings/catena-templates
          lock: ws/${{ github.event.repository.name }}/.github/catenahq.lock
          token: ${{ secrets.CATENA_EE_READ_TOKEN }}
          fetch-depth: '0'
      - name: Fetch sibling contracts
        if: steps.tree.outputs.run == 'true' && contains(fromJSON(steps.matrix.outputs.bundles), 'contracts')
        uses: ./.catena-ci/.github/actions/checkout-sibling
        with:
          repository: catenahq/contracts
          path: siblings/contracts
          lock: ws/${{ github.event.repository.name }}/.github/catenahq.lock
          token: ${{ secrets.CATENA_EE_READ_TOKEN }}
          fetch-depth: '0'
      - name: Fetch sibling docs
        if: steps.tree.outputs.run == 'true' && contains(fromJSON(steps.matrix.outputs.bundles), 'docs')
        uses: ./.catena-ci/.github/actions/checkout-sibling
        with:
          repository: catenahq/docs
          path: siblings/docs
          lock: ws/${{ github.event.repository.name }}/.github/catenahq.lock
          token: ${{ secrets.CATENA_EE_READ_TOKEN }}
          fetch-depth: '0'
      - name: Fetch sibling ops
        if: steps.tree.outputs.run == 'true' && contains(fromJSON(steps.matrix.outputs.bundles), 'ops')
        uses: ./.catena-ci/.github/actions/checkout-sibling
        with:
          repository: catenahq/ops
          path: siblings/ops
          lock: ws/${{ github.event.repository.name }}/.github/catenahq.lock
          token: ${{ secrets.CATENA_EE_READ_TOKEN }}
          fetch-depth: '0'
      - name: Bundle the siblings
        id: bundle
        if: steps.tree.outputs.run == 'true' && steps.matrix.outputs.bundles != '[]'
        env:
          BUNDLES: ${{ steps.matrix.outputs.bundles }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sibling-bundles"
          shas='{}'
          for repo in $(jq -r '.[]' <<< "$BUNDLES"); do
            git -C "siblings/$repo" bundle create "$RUNNER_TEMP/sibling-bundles/$repo.bundle" HEAD
            sha="$(git -C "siblings/$repo" rev-parse HEAD)"
            shas="$(jq -c --arg repo "$repo" --arg sha "$sha" '.[$repo] = $sha' <<< "$shas")"
          done
          echo "bundle-shas=$shas" >> "$GITHUB_OUTPUT"
      - name: Upload the sibling bundles
        if: steps.bundle.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sibling-bundles
          path: ${{ runner.temp }}/sibling-bundles
          retention-days: 1
          if-no-files-found: error

  check:
    name: check (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        working-directory: ws/${{ github.event.repository.name }}
    steps:
      - name: Check out the caller
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          path: ws/${{ github.event.repository.name }}
          persist-credentials: false
      - name: Check out the CI code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .catena-ci
          persist-credentials: false
      # One step per sibling the matrix parser knows (SIBLINGS in
      # scripts/ci/checks-matrix.mjs), each at the caller's lock; a bundle
      # sibling is cloned from plan's artifact below.
      - name: Check out sibling catena-admin
        if: matrix.sib.catena-admin != '' && matrix.sib.catena-admin != 'bundle'
        uses: ./.catena-ci/.github/actions/checkout-sibling
        with:
          repository: catenahq/catena-admin
          path: ws/catena-admin
          lock: ws/${{ github.event.repository.name }}/.github/catenahq.lock
          fetch-depth: ${{ matrix.sib.catena-admin }}
      - name: Check out sibling catena-ce
        if: matrix.sib.catena-ce != '' && matrix.sib.catena-ce != 'bundle'
        uses: ./.catena-ci/.github/actions/checkout-sibling
        with:
          repository: catenahq/catena-ce
          path: ws/catena-ce
          lock: ws/${{ github.event.repository.name }}/.github/catenahq.lock
          fetch-depth: ${{ matrix.sib.catena-ce }}
      - name: Check out sibling catena-templates
        if: matrix.sib.catena-templates != '' && matrix.sib.catena-templates != 'bundle'
        uses: ./.catena-ci/.github/actions/checkout-sibling
        with:
          repository: catenahq/catena-templates
          path: ws/catena-templates
          lock: ws/${{ github.event.repository.name }}/.github/catenahq.lock
          fetch-depth: ${{ matrix.sib.catena-templates }}
      - name: Check out sibling contracts
        if: matrix.sib.contracts != '' && matrix.sib.contracts != 'bundle'
        uses: ./.catena-ci/.github/actions/checkout-sibling
        with:
          repository: catenahq/contracts
          path: ws/contracts
          lock: ws/${{ github.event.repository.name }}/.github/catenahq.lock
          fetch-depth: ${{ matrix.sib.contracts }}
      - name: Check out sibling docs
        if: matrix.sib.docs != '' && matrix.sib.docs != 'bundle'
        uses: ./.catena-ci/.github/actions/checkout-sibling
        with:
          repository: catenahq/docs
          path: ws/docs
          lock: ws/${{ github.event.repository.name }}/.github/catenahq.lock
          fetch-depth: ${{ matrix.sib.docs }}
      - name: Check out sibling ops
        if: matrix.sib.ops != '' && matrix.sib.ops != 'bundle'
        uses: ./.catena-ci/.github/actions/checkout-sibling
        with:
          repository: catenahq/ops
          path: ws/ops
          lock: ws/${{ github.event.repository.name }}/.github/catenahq.lock
          fetch-depth: ${{ matrix.sib.ops }}
      # A bundle sibling, at the commit plan bundled: no secret reaches this job.
      - name: Download the sibling bundles
        if: contains(matrix.sib.*, 'bundle')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sibling-bundles
          path: ${{ runner.temp }}/sibling-bundles
      - name: Clone the sibling bundles
        if: contains(matrix.sib.*, 'bundle')
        working-directory: ${{ github.workspace }}
        env:
          SIB: ${{ toJSON(matrix.sib) }}
          SHAS: ${{ needs.plan.outputs.bundle-shas }}
        run: |
          set -euo pipefail
          for repo in $(jq -r 'to_entries[] | select(.value == "bundle") | .key' <<< "$SIB"); do
            sha="$(jq -r --arg repo "$repo" '.[$repo]' <<< "$SHAS")"
            echo "catenahq/$repo: $sha (bundle)"
            git clone --quiet --no-checkout "$RUNNER_TEMP/sibling-bundles/$repo.bundle" "ws/$repo"
            git -C "ws/$repo" checkout --quiet --detach "$sha"
          done
      - if: matrix.tools.node != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.tools.node }}
      - if: matrix.tools.uv != ''
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ matrix.tools.uv }}
          enable-cache: false
      - if: matrix.tools.go != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.tools.go-file == '' && matrix.tools.go || '' }}
          go-version-file: ${{ matrix.tools.go-file }}
          cache: false
      # The Go build and module caches of a check with go-cache. A run restores
      # the newest entry with the go.sum beside the go file, else the newest of
      # any; only a scheduled run saves (the last step), so a pull request run
      # never writes a cache another run restores.
      - name: Go toolchain
        id: go-env
        if: matrix.go-cache
        env:
          GO_FILE: ${{ matrix.tools.go-file }}
          REPO: ${{ github.event.repository.name }}
        run: |
          go version
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          if [ -n "$GO_FILE" ]; then
            echo "gosum=$(dirname "$GO_FILE")/go.sum" >> "$GITHUB_OUTPUT"
          else
            echo "gosum=ws/$REPO/go.sum" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore the Go build and module caches
        if: matrix.go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.gocache }}
            ${{ steps.go-env.outputs.gomodcache }}
          key: go-${{ hashFiles(steps.go-env.outputs.gosum) }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-${{ hashFiles(steps.go-env.outputs.gosum) }}-
            go-
      - name: Bound the Go build cache
        # Go drops entries unused for five days; a build cache over 3 GiB is
        # emptied, so one saved entry stays a small share of the repository's
        # 10 GB of Actions cache.
        if: matrix.go-cache
        run: |
          dir="$(go env GOCACHE)"
          size_mb="$(du -sm "$dir" 2>/dev/null | cut -f1)"
          echo "Go build cache: ${size_mb:-0} MB"
          if [ "${size_mb:-0}" -gt 3072 ]; then
            go clean -cache
            echo "Over 3072 MB: emptied."
          fi
      - name: Install staticcheck
        if: matrix.tools.staticcheck != ''
        working-directory: ${{ runner.temp }}
        env:
          VERSION: ${{ matrix.tools.staticcheck }}
          SHA256: ${{ matrix.tools.staticcheck-sha256 }}
        run: |
          curl -fsSLo staticcheck.tar.gz "https://github.com/dominikh/go-tools/releases/download/${VERSION}/staticcheck_linux_amd64.tar.gz"
          echo "$SHA256  staticcheck.tar.gz" | sha256sum -c -
          tar -xzf staticcheck.tar.gz
          echo "$RUNNER_TEMP/staticcheck" >> "$GITHUB_PATH"
      # Pinned in contracts/.vale-version, which check-prose.mjs also reads and
      # enforces: the grammars decide which comments are visible.
      - name: Install vale
        if: matrix.name == 'gates'
        working-directory: ${{ github.workspace }}
        run: |
          version="$(cat ws/contracts/.vale-version)"
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/errata-ai/vale/releases/download/v${version}/vale_${version}_Linux_64-bit.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" vale
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Contracts gates
        # Every gate runs and prints its findings; any failure fails the step.
        if: matrix.name == 'gates'
        env:
          APP_NAMES: ${{ toJSON(matrix.gates.core-app-names) }}
          DUPLICATION: ${{ matrix.gates.duplication }}
        run: |
          status=0
          node ../contracts/scripts/check-unicode.mjs || status=1
          node ../contracts/scripts/check-repo-rules.mjs || status=1
          node ../contracts/scripts/check-prose.mjs || status=1
          mapfile -t args < <(jq -r '.[]' <<< "$APP_NAMES")
          if [ "${#args[@]}" -gt 0 ]; then
            node ../contracts/scripts/check-core-app-names.mjs "${args[@]}" || status=1
          fi
          if [ "$DUPLICATION" = true ]; then
            npx --yes jscpd@4.3.0 --silent || status=1
          fi
          exit "$status"
      - name: bash ci/run ${{ matrix.name }}
        if: matrix.name != 'gates'
        env:
          CHECK: ${{ matrix.name }}
        run: bash ci/run "$CHECK"
      # A scheduled run runs every check (a schedule never reuses a result), so
      # the daily run refreshes the cache. A failed check saves too: Go writes
      # only finished build outputs to its cache.
      - name: Save the Go build and module caches
        if: ${{ !cancelled() && github.event_name == 'schedule' && matrix.go-cache && steps.go-env.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.gocache }}
            ${{ steps.go-env.outputs.gomodcache }}
          key: go-${{ hashFiles(steps.go-env.outputs.gosum) }}-${{ github.run_id }}-${{ github.run_attempt }}

  scan:
    # scanctl over the caller's tree and own images (.github/actions/scan).
    needs: plan
    if: needs.plan.outputs.scan-run == 'true' && github.event_name != 'schedule'
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      security-events: write # code-scanning upload (public repositories)
      pull-requests: write # the sticky findings comment
    steps:
      - name: Check out the CI code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .catena-ci
          persist-credentials: false
      - uses: ./.catena-ci/.github/actions/scan
        with:
          scan: ${{ needs.plan.outputs.scan }}

  scan-daily:
    # The scan of a scheduled run: image pulls log in to Docker Hub with the
    # caller's environment ci when it holds DOCKERHUB_USERNAME and
    # DOCKERHUB_TOKEN, and a failure opens the issue labelled scan, or comments
    # on the open one.
    needs: plan
    if: needs.plan.outputs.scan-run == 'true' && github.event_name == 'schedule'
    runs-on: ${{ inputs.runner }}
    environment:
      name: ci
      deployment: false
    permissions:
      contents: read
      security-events: write # code-scanning upload (public repositories)
      pull-requests: write # the sticky findings comment
      issues: write # the scan issue
    steps:
      - name: Check out the CI code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .catena-ci
          persist-credentials: false
      - name: Docker Hub login
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "environment ci holds no Docker Hub login: images are pulled anonymously"
            exit 0
          fi
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - uses: ./.catena-ci/.github/actions/scan
        with:
          scan: ${{ needs.plan.outputs.scan }}
      - name: Open or update the scan issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          number="$(gh issue list --repo "$REPO" --label scan --state open --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body "The scheduled scan failed again: $RUN_URL"
            exit 0
          fi
          if ! gh api "repos/$REPO/labels/scan" --silent; then
            gh label create scan --repo "$REPO" --description "The scheduled scan failed"
          fi
          gh issue create --repo "$REPO" --label scan --title "The scheduled scan failed" \
            --body "The scheduled scan failed: $RUN_URL. The run's summary lists the findings; later failures comment here."

  gate:
    # The required status: a draft, a plan that did not succeed, or a check or
    # scan that ended other than success or skipped fails it. A reused result
    # skips every check and scan and passes. On a pull request it then posts
    # the commit status of the same name, pending while a Depends-on pull
    # request is open.
    needs: [plan, check, scan, scan-daily]
    if: ${{ !cancelled() }}
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      statuses: write # the commit status ci / gate
      pull-requests: read # the pull request body and the pull requests it depends on
    steps:
      - name: Gate
        env:
          DRAFT: ${{ github.event.pull_request.draft }}
          PLAN: ${{ needs.plan.result }}
          CHECK: ${{ needs.check.result }}
          SCAN: ${{ needs.scan.result }}
          SCAN_DAILY: ${{ needs.scan-daily.result }}
        run: |
          if [ "$DRAFT" = true ]; then
            echo "::error::a draft pull request does not pass the gate; mark it ready for review"
            exit 1
          fi
          if [ "$PLAN" != success ]; then
            echo "::error::plan: $PLAN"
            exit 1
          fi
          status=0
          for job in "checks: $CHECK" "scan: $SCAN" "scan-daily: $SCAN_DAILY"; do
            case "${job#*: }" in
              success | skipped) echo "$job" ;;
              *)
                echo "::error::$job"
                status=1
                ;;
            esac
          done
          exit "$status"
      # Reached only when the result above passed: a failed result never
      # posts success.
      - name: Check out the CI code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .catena-ci
          persist-credentials: false
      - if: github.event_name == 'pull_request'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26.13.1"
      - name: Post the commit status ci / gate
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: node .catena-ci/scripts/ci/gate-status.mjs --repo "$REPO" --pr "$PR" --sha "$SHA"
