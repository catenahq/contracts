name: ci-control
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review, auto_merge_enabled]
  workflow_run:
    workflows: [ci]
    types: [completed]
  push:
    branches: [main]
  schedule:
    - cron: '5 * * * *'
permissions: {}
jobs:
  control:
    uses: ./.github/workflows/control.yml
    permissions:
      contents: read
      actions: read
      checks: read
      statuses: write
      pull-requests: read
    with:
      runner: ubuntu-26.04
      apps: false
      release: false
      step: ${{ inputs.step }}
      version: ${{ inputs.version }}
