name: CI

# Validates every artifact in this repo:
#   - JSON files parse
#   - brand/test.js smoke test passes
#   - JSON files match their documented shape (basic key presence
#     + types; full schema validation is a follow-up)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate contracts
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
      - name: Check required runner tools
        run: |
          missing=''
          for t in git; do command -v "$t" >/dev/null 2>&1 || missing="$missing $t"; done
          if [ -n "$missing" ]; then
            echo "::error::Required tool(s) missing on the runner:$missing"
            echo "::error::Install on the self-hosted runner: sudo apt-get install -y git -- see catenahq/ops internal_docs/operator/ci-runner-provisioning.md"
            exit 1
          fi
      - name: Unicode hygiene (no em dashes / smart quotes / decorative symbols)
        run: node scripts/check-unicode.mjs
      - name: Run brand smoke test
        run: node brand/test.js
      - name: Validate JSON artifacts
        run: node scripts/validate-json.mjs
