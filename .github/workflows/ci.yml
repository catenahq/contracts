name: CI

# Validates every artifact in this repo:
#   - JSON files parse
#   - brand/test.js smoke test passes
#   - JSON files match their documented shape (basic key presence
#     + types; full schema validation is a follow-up)
#
# A push to a branch keeps the absolute gate. A pull request is judged on what
# it introduces: the validation steps and the duplication ratchet run through
# this repo's new-failures-only action, which fails only on failures the base
# commit does not have.

on:
  # Every pushed branch. Renovate and engine-bump branches always carry a pull
  # request, which tests each push to them.
  push:
    branches-ignore: ['renovate/**', 'engine-bump/**', 'scanctl/**']
  pull_request:

permissions:
  contents: read

# A newer push to the branch, or a newer commit of the pull request, cancels the
# run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"
      - name: Unicode hygiene (no em dashes / smart quotes / decorative symbols)
        # A finding is its file, its kind and its line's text: the sed drops
        # the line number, so a moved line is not a new finding.
        uses: catenahq/contracts/.github/actions/new-failures-only@main
        with:
          working-directory: ${{ github.workspace }}
          repo-path: ${{ github.workspace }}
          failure-lines: '^  [^ :]+: .*'
          run: |
            node scripts/check-unicode.mjs 2>&1 \
              | sed -E '/^  [^ :]+:[0-9]+: /{N;s/^(  [^ :]+):[0-9]+: ([^\n]*)\n +(.*)$/\1: \2 | \3/}'
      - name: Repo rules, brand smoke test, JSON artifacts and script tests
        # Script tests: comment parsers, the gates on a deleted tracked file,
        # the new-failures-only script.
        uses: catenahq/contracts/.github/actions/new-failures-only@main
        with:
          working-directory: ${{ github.workspace }}
          repo-path: ${{ github.workspace }}
          run: |
            node scripts/check-repo-rules.mjs
            node brand/test.js
            node scripts/validate-json.mjs
            node scripts/lib/yaml-comments.test.mjs
            node scripts/lib/shell-comments.test.mjs
            node scripts/gates.test.mjs
            node scripts/new-failures-only.test.mjs
            node scripts/check-core-app-names.test.mjs

  duplication:
    # Copy-paste ratchet: .jscpd.json carries the baseline threshold;
    # exceeding it fails. Lower the threshold as duplication is paid
    # down, never raise it to admit new copy-paste.
    name: Duplication (jscpd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"
      - name: jscpd (threshold in .jscpd.json)
        uses: catenahq/contracts/.github/actions/new-failures-only@main
        with:
          working-directory: ${{ github.workspace }}
          repo-path: ${{ github.workspace }}
          run: npx --yes jscpd@4 --silent
