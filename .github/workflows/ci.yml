name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '11 6 * * *'
permissions: {}
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: ./.github/workflows/pr.yml
    permissions:
      contents: read
      actions: read
      statuses: write
      pull-requests: write
      security-events: write
      issues: write
    with:
      runner: ubuntu-26.04
