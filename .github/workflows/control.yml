name: control

# The shared workflow of the jobs that run from a repository's protected
# branch. A caller's ci-control.yml holds the triggers and calls this file
# (README.md, "Control workflow").
#
# depends posts the commit status ci / gate of a pull request on each of its
# pull_request_target events, so an edited Depends-on line counts at once; it
# is success only once the ci / gate check run passed. update brings the
# oldest ready auto-merge pull request of each base up to date with it, one at
# a time, and recomputes the status of the pull requests with the head a ci
# run judged, and hourly of every open one. Every App token that writes is
# scoped to this repository, or to ops for dispatch; the reads of other
# repositories take a read-only token of the repositories the pull requests
# name (.github/actions/read-token). With apps, dispatch sends the
# app a pull request changes to the app tests after its ci run, and tag tags
# the apps of a merged pull request on the push of its merge. With release,
# release runs the release step a dispatch on main names. policy judges the
# workflows of a pull request and posts the commit status workflow policy.
# Every job loads the CI code from this repository at the commit the caller
# pins (job.workflow_sha); only dispatch checks out the caller's pull request,
# as data its tools read, never run, and policy reads its files through the
# API as data.

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label of every job.
        type: string
        required: true
      apps:
        description: The ci / gate status and the updater also wait for the app-tests status; dispatch and tag run.
        type: boolean
        default: false
      release:
        description: The repository is released from the release branch.
        type: boolean
        default: false
      step:
        description: The release step a dispatch runs, cut, tag or merge-back.
        type: string
        default: ""
      version:
        description: The version a dispatch releases.
        type: string
        default: ""

permissions: {}

jobs:
  depends:
    if: github.event_name == 'pull_request_target'
    runs-on: ${{ inputs.runner }}
    # The CI App's client id and private key, for the read-only token of the
    # repositories the pull request names, are secrets of the caller's
    # environment ci.
    environment:
      name: ci
      deployment: false
    permissions:
      contents: read # the CI code, the lock files and the base's .github/checks.yml
      statuses: write # the commit status ci / gate
      pull-requests: read # the pull request body
      checks: read # the ci / gate check run of the head
    steps:
      - name: Check out the CI code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .catena-ci
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26.13.1"
      - name: Install the YAML parser
        run: npm ci --prefix .catena-ci/scripts/ci --ignore-scripts --no-audit --no-fund
      - name: Mint a read-only token of the repositories the pull request names
        id: read-token
        uses: ./.catena-ci/.github/actions/read-token
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          pull-request: ${{ github.event.pull_request.number }}
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
      # app-tests is waited for when the base's .github/checks.yml declares
      # apps, read as data; the input apps must agree.
      - name: Post the commit status ci / gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_READ_TOKEN: ${{ steps.read-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          APPS: ${{ inputs.apps }}
        run: >-
          node .catena-ci/scripts/ci/gate-status.mjs --repo "$REPO" --pr "$PR" --sha "$SHA"
          --apps-from "$BASE" --expect-apps "$APPS"

  update:
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_run' || github.event_name == 'schedule' ||
      (github.event_name == 'pull_request_target' && github.event.action == 'auto_merge_enabled')
    runs-on: ${{ inputs.runner }}
    # The CI App's client id and private key are secrets of the caller's
    # environment ci.
    environment:
      name: ci
      deployment: false
    # One updater per repository at a time: a running one is never
    # cancelled, and a newer run replaces the one waiting.
    concurrency:
      group: update-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read # the CI code
      pull-requests: read # the open pull requests' Depends-on lines
    steps:
      - name: Mint a CI App token
        # This repository alone. update-branch needs contents write, and the
        # workflows permission when the base's history it merges holds
        # workflow changes.
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-statuses: write
          permission-checks: read
          permission-workflows: write
      - name: Check out the CI code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .catena-ci
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26.13.1"
      - name: Install the YAML parser
        run: npm ci --prefix .catena-ci/scripts/ci --ignore-scripts --no-audit --no-fund
      - name: Mint a read-only token of the repositories the open pull requests name
        id: read-token
        uses: ./.catena-ci/.github/actions/read-token
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
      - name: Update the next pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_READ_TOKEN: ${{ steps.read-token.outputs.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          # The pushed commit, or the head the ci run judged.
          SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          APPS: ${{ inputs.apps }}
        run: |
          args=(--repo "$REPO" --event "$EVENT" --sha "$SHA")
          if [ "$APPS" = true ]; then args+=(--apps); fi
          node .catena-ci/scripts/ci/update.mjs "${args[@]}"

  dispatch:
    # After the ci run of a pull request of this repository: workflow_run lists
    # no pull request of a fork.
    if: >-
      inputs.apps && github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.pull_requests[0].number
    runs-on: ${{ inputs.runner }}
    # The CI App's client id and private key are secrets of the caller's
    # environment ci.
    environment:
      name: ci
      deployment: false
    # A newer head of the pull request cancels the send of an older one.
    concurrency:
      group: dispatch-${{ github.repository }}-${{ github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: true
    permissions:
      contents: read # the CI code, the tools and the pull request head
      statuses: write # app-tests when no app changed, and ci / gate
      pull-requests: read # the pull request, its commits and the pull requests it depends on
      checks: read # the ci / gate check run of the head
    env:
      # uv reads no configuration of a checked-out tree.
      UV_NO_CONFIG: "1"
    steps:
      - name: Mint a CI App token that sends to ops
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ops
          permission-contents: write
      - name: Check out the CI code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .catena-ci
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26.13.1"
      - name: Install the YAML parser
        run: npm ci --prefix .catena-ci/scripts/ci --ignore-scripts --no-audit --no-fund
      # Before the pull request head is checked out: no step that runs after
      # tools read the head uses the App's key.
      - name: Mint a read-only token of the repositories the pull request names
        id: read-token
        uses: ./.catena-ci/.github/actions/read-token
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          pull-request: ${{ github.event.workflow_run.pull_requests[0].number }}
          base: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
          head: ${{ github.event.workflow_run.head_sha }}
      - name: Check out the base
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          path: caller
          persist-credentials: false
      # The tools are the base's: this tree's with apps.catalog true, else those
      # of catena-templates at the base's lock.
      - name: The app settings
        id: apps
        working-directory: caller
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          RUNNER_LABEL: ${{ inputs.runner }}
        run: |
          set -euo pipefail
          plan="$(node "$GITHUB_WORKSPACE/.catena-ci/scripts/ci/checks-matrix.mjs" --repo "$REPO_NAME" --runner "$RUNNER_LABEL")"
          apps="$(jq -c .apps <<< "$plan")"
          if [ "$(jq -r .enabled <<< "$apps")" != true ]; then
            echo "::error::the input apps is true and .github/checks.yml has no apps key"
            exit 1
          fi
          tools="$GITHUB_WORKSPACE/caller"
          if [ "$(jq -r .catalog <<< "$apps")" != true ]; then tools="$GITHUB_WORKSPACE/.tools"; fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "tools=$tools" >> "$GITHUB_OUTPUT"
      - name: Check out the app tools
        if: ${{ !fromJSON(steps.apps.outputs.apps).catalog }}
        uses: ./.catena-ci/.github/actions/checkout-sibling
        with:
          repository: catenahq/catena-templates
          path: .tools
          lock: caller/.github/catenahq.lock
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ fromJSON(steps.apps.outputs.apps).app.tools.uv }}
          enable-cache: false
      # Data only: the tools read it with git, nothing in it runs.
      - name: Check out the pull request head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: pr
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Send the app to the app tests
        env:
          REPO: ${{ github.repository }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          TEMPLATES_ROOT: ${{ github.workspace }}/pr
          TOOLS: ${{ steps.apps.outputs.tools }}
          OWN_IMAGES: ${{ fromJSON(steps.apps.outputs.apps).own-images }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ github.token }}
          OPS_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash "$GITHUB_WORKSPACE/.catena-ci/scripts/ci/app-dispatch.sh"
      - name: Post the commit status ci / gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_READ_TOKEN: ${{ steps.read-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: node .catena-ci/scripts/ci/gate-status.mjs --repo "$REPO" --pr "$PR" --sha "$SHA" --app-tests

  tag:
    if: inputs.apps && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ${{ inputs.runner }}
    # The CI App's client id and private key are secrets of the caller's
    # environment ci.
    environment:
      name: ci
      deployment: false
    permissions:
      contents: read # the CI code, the history and the tags
      statuses: read # the app-tests status of the merged head
      pull-requests: read # the pull request merged as the pushed commit
    env:
      UV_NO_CONFIG: "1"
    steps:
      - name: Mint a CI App token that writes tags
        # The App is the one actor the tag ruleset lets create or move a */* tag.
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          # Writing a ref (git/refs) also takes the workflows permission when the tagged
          # history holds workflow changes (GitHub lists those endpoints under Workflows too).
          permission-workflows: write
      - name: Check out the CI code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .catena-ci
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26.13.1"
      - name: Install the YAML parser
        run: npm ci --prefix .catena-ci/scripts/ci --ignore-scripts --no-audit --no-fund
      - name: Check out the pushed commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          path: caller
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      # The tools: this tree's with apps.catalog true, else those of
      # catena-templates at the pushed commit's lock.
      - name: The app settings
        id: apps
        working-directory: caller
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          RUNNER_LABEL: ${{ inputs.runner }}
        run: |
          set -euo pipefail
          plan="$(node "$GITHUB_WORKSPACE/.catena-ci/scripts/ci/checks-matrix.mjs" --repo "$REPO_NAME" --runner "$RUNNER_LABEL")"
          apps="$(jq -c .apps <<< "$plan")"
          if [ "$(jq -r .enabled <<< "$apps")" != true ]; then
            echo "::error::the input apps is true and .github/checks.yml has no apps key"
            exit 1
          fi
          tools="$GITHUB_WORKSPACE/caller"
          if [ "$(jq -r .catalog <<< "$apps")" != true ]; then tools="$GITHUB_WORKSPACE/.tools"; fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "tools=$tools" >> "$GITHUB_OUTPUT"
      - name: Check out the app tools
        if: ${{ !fromJSON(steps.apps.outputs.apps).catalog }}
        uses: ./.catena-ci/.github/actions/checkout-sibling
        with:
          repository: catenahq/catena-templates
          path: .tools
          lock: caller/.github/catenahq.lock
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ fromJSON(steps.apps.outputs.apps).app.tools.uv }}
          enable-cache: false
      - name: Tag the apps
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TEMPLATES_ROOT: ${{ github.workspace }}/caller
          TOOLS: ${{ steps.apps.outputs.tools }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ github.token }}
          TAG_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash "$GITHUB_WORKSPACE/.catena-ci/scripts/ci/app-tag.sh"

  release:
    if: inputs.release && github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
    runs-on: ${{ inputs.runner }}
    # The CI App's client id and private key are secrets of the caller's
    # environment ci.
    environment:
      name: ci
      deployment: false
    # One release step per repository at a time, never cancelled.
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read # the CI code
    steps:
      - name: Mint a CI App token that releases
        # The App moves the release branch, writes the tag and opens the
        # merge-back pull request. Writing a ref takes the workflows permission
        # when the history it adds holds workflow changes.
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Check out the CI code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .catena-ci
          persist-credentials: false
      - name: Run the release step
        env:
          REPO: ${{ github.repository }}
          STEP: ${{ inputs.step }}
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash "$GITHUB_WORKSPACE/.catena-ci/scripts/ci/release.sh"

  policy:
    # The workflow policy of the pull request head (README.md, "Workflow
    # policy"): its files are read through the API as data, never checked out
    # or run.
    # A new base (a stacked pull request retargeted) is judged again.
    if: >-
      github.event_name == 'pull_request_target' &&
      (contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action) ||
      (github.event.action == 'edited' && github.event.changes.base))
    runs-on: ${{ inputs.runner }}
    # The policy App's client id and private key are secrets of the caller's
    # environment workflow-policy.
    environment:
      name: workflow-policy
      deployment: false
    # A newer head of the pull request cancels the verdict of an older one.
    concurrency:
      group: policy-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read # the CI code and the lock files
      pull-requests: read # the pull request body
    steps:
      - name: The policy App
        # Without the App the job posts nothing, so a caller runs before the
        # App exists.
        id: app
        env:
          CLIENT_ID: ${{ secrets.POLICY_APP_CLIENT_ID }}
        run: |
          if [ -z "$CLIENT_ID" ]; then
            echo "::notice::environment workflow-policy holds no POLICY_APP_CLIENT_ID: no policy verdict is posted"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Mint a policy App token
        # This repository alone: reads the pull request and its files, and
        # posts the status.
        if: steps.app.outputs.enabled == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.POLICY_APP_CLIENT_ID }}
          private-key: ${{ secrets.POLICY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: read
          permission-statuses: write
      - name: Check out the CI code
        if: steps.app.outputs.enabled == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .catena-ci
          persist-credentials: false
      - if: steps.app.outputs.enabled == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26.13.1"
      - name: Install the YAML parser
        if: steps.app.outputs.enabled == 'true'
        run: npm ci --prefix .catena-ci/scripts/ci --ignore-scripts --no-audit --no-fund
      - name: Mint a read-only policy App token of the repositories the lock files name
        # The rule merged compares their commits; the policy reads no
        # Depends-on pull request.
        if: steps.app.outputs.enabled == 'true'
        id: read-token
        uses: ./.catena-ci/.github/actions/read-token
        with:
          client-id: ${{ secrets.POLICY_APP_CLIENT_ID }}
          private-key: ${{ secrets.POLICY_APP_PRIVATE_KEY }}
          locks-only: "true"
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
      - name: Fetch the pull request's files
        if: steps.app.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: >-
          node .catena-ci/scripts/ci/workflow-policy.mjs fetch --repo "$REPO" --pr "$PR"
          --head "$HEAD" --base "$BASE" --dir "$RUNNER_TEMP/policy"
      - name: Build scanctl
        if: steps.app.outputs.enabled == 'true'
        uses: ./.catena-ci/.github/actions/scanctl
      - name: zizmor
        # scanctl with zizmor alone over the fetched head; its exit status
        # goes to the verdict.
        id: zizmor
        if: steps.app.outputs.enabled == 'true'
        env:
          # zizmor's API-backed audits use this when present.
          GH_TOKEN: ${{ github.token }}
          ACTIONS_RUNTIME_TOKEN: ""
        run: |
          status=0
          "$RUNNER_TEMP/bin/scanctl" run --config .catena-ci/scripts/ci/workflow-policy-scanctl.yml \
            --out "$RUNNER_TEMP/policy/zizmor.sarif" --summary "$RUNNER_TEMP/policy/zizmor.md" \
            "$RUNNER_TEMP/policy/pr" || status=$?
          if [ -f "$RUNNER_TEMP/policy/zizmor.md" ]; then cat "$RUNNER_TEMP/policy/zizmor.md" >> "$GITHUB_STEP_SUMMARY"; fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Post the commit status workflow policy
        id: verdict
        if: steps.app.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_READ_TOKEN: ${{ steps.read-token.outputs.token }}
          REPO: ${{ github.repository }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          ZIZMOR: ${{ steps.zizmor.outputs.status }}
        run: >-
          node .catena-ci/scripts/ci/workflow-policy.mjs check --repo "$REPO" --sha "$HEAD"
          --dir "$RUNNER_TEMP/policy" --zizmor "$ZIZMOR"
      - name: Post the commit status workflow policy as error
        # A step that failed before the verdict posted it: the status is error,
        # never left to an earlier success.
        if: failure() && steps.app-token.outcome == 'success' && steps.verdict.outputs.posted != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node .catena-ci/scripts/ci/workflow-policy.mjs error --repo "$REPO" --sha "$HEAD"
