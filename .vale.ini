# Prose gate for code comments. Identical in every catena repo: written
# by contracts/scripts/sync-shared.mjs, read by scripts/check-prose.mjs.
# The rules live in vale/Catena/.
#
# A repo that has none of the extensions below simply scans nothing; the
# file does not need a per-repo variant.
#
# COVERAGE. Vale finds comments with a tree-sitter grammar per language.
# Two gaps matter here, and both are silent rather than loud:
#
#   .mjs   No grammar ships for it. A `[formats]` entry does not help:
#          formats maps an extension to a MARKUP parser (md, rst), so
#          `mjs = js` parses nothing at all. The shared scripts in this
#          workspace are .mjs and are not gated.
#   .yml   Read as plain text, not parsed for comments. Unscoped rules
#          would match Ansible task names and data values; comment-scoped
#          rules match nothing. Excluded until an extractor exists.
#
# Both are listed with an empty BasedOnStyles so the exclusion is visible
# rather than implied.
StylesPath = vale
MinAlertLevel = warning

[*.{py,go,js,jsx,ts,tsx}]
BasedOnStyles = Catena

[*.{yml,yaml,mjs}]
BasedOnStyles =
