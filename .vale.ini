# Prose gate for code comments. Identical in every catena repo: written
# by contracts/scripts/sync-shared.mjs, read by scripts/check-prose.mjs.
# The rules live in vale/Catena/.
#
# A repo that has none of the extensions below simply scans nothing; the
# file does not need a per-repo variant.
#
# COVERAGE. Vale finds comments with a tree-sitter grammar per language.
#
#   .yml   Read as plain text, not parsed for comments, so passing one
#          here matches Ansible task names and data values. YAML reaches
#          the rules another way: check-prose.mjs reduces each file to a
#          comment skeleton and hands it over as .py, which maps line and
#          column exactly. Vale never sees a .yml, hence the exclusion.
#   .mjs   No grammar ships for it, and a `[formats]` entry does not
#          help: formats maps an extension to a MARKUP parser (md, rst),
#          so `mjs = js` parses nothing at all. The shared scripts in
#          this workspace are .mjs and are not gated.
#
# Both are listed with an empty BasedOnStyles so the exclusion is visible
# rather than implied.
StylesPath = vale
MinAlertLevel = warning

[*.{py,go,js,jsx,ts,tsx}]
BasedOnStyles = Catena

[*.{yml,yaml,mjs}]
BasedOnStyles =
